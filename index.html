<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vérificateur de réponse</title>
    <style>
      :root {
        --primary: #6366f1;
        --primary-glow: rgba(99, 102, 241, 0.5);
        --success: #10b981;
        --success-glow: rgba(16, 185, 129, 0.5);
        --error: #ef4444;
        --error-glow: rgba(239, 68, 68, 0.5);
      }

      * {
        box-sizing: border-box;
      }

      body {
        font-family:
          "Segoe UI",
          system-ui,
          -apple-system,
          sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        width: 100vw;
        margin: 0;
        padding: 2rem;
        overflow: hidden;
        position: relative;
        background: linear-gradient(-45deg, #0f0c29, #302b63, #24243e);
        background-size: 400% 400%;
        animation: gradientBG 15s ease infinite;
        color: #fff;
      }

      @keyframes gradientBG {
        0% {
          background-position: 0% 50%;
        }
        50% {
          background-position: 100% 50%;
        }
        100% {
          background-position: 0% 50%;
        }
      }

      /* Emojis flottants */
      .emojis {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: -1;
      }

      .emoji {
        position: absolute;
        font-size: 1.5rem;
        opacity: 0.7;
        transition:
          transform 0.1s ease-out,
          opacity 0.1s ease;
      }

      .emoji.drift {
        animation: float 15s infinite linear;
      }

      @keyframes float {
        0% {
          transform: translateY(0) rotate(0deg);
          opacity: 0;
        }
        10% {
          opacity: 0.7;
        }
        90% {
          opacity: 0.7;
        }
        100% {
          transform: translateY(-100vh) rotate(360deg);
          opacity: 0;
        }
      }

      .container {
        text-align: center;
        max-width: 400px;
        width: 100%;
        position: relative;
        z-index: 1;
      }

      h1 {
        color: #fff;
        margin-bottom: 1.5rem;
        text-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
        font-size: 2rem;
      }

      .input-group {
        display: flex;
        gap: 0.5rem;
        margin-bottom: 1rem;
      }

      #wordInput {
        min-width: 20px;
        flex: 1;
        padding: 0.75rem 1rem;
        font-size: 1rem;
        border: 2px solid rgba(255, 255, 255, 0.3);
        border-radius: 0.5rem;
        background: rgba(255, 255, 255, 0.1);
        color: #fff;
        transition: all 0.3s ease;
        backdrop-filter: blur(5px);
      }

      #wordInput:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 15px var(--primary-glow);
      }

      #wordInput::placeholder {
        color: rgba(255, 255, 255, 0.5);
      }

      #validateBtn {
        padding: 0.75rem 1.5rem;
        font-size: 1rem;
        background: linear-gradient(135deg, var(--primary), #8b5cf6);
        color: white;
        border: none;
        border-radius: 0.5rem;
        cursor: pointer;
        transition: all 0.3s ease;
        font-weight: 600;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 15px var(--primary-glow);
      }

      #validateBtn:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 25px var(--primary-glow);
      }

      #validateBtn:active {
        transform: translateY(0);
      }

      #validateBtn::before {
        content: "";
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(255, 255, 255, 0.2),
          transparent
        );
        transition: 0.5s;
      }

      #validateBtn:hover::before {
        left: 100%;
      }

      #message {
        margin-top: 1rem;
        padding: 1rem;
        border-radius: 0.5rem;
        font-weight: 500;
        min-height: 2.5rem;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.1rem;
        transform: scale(0.9);
        opacity: 0;
        transition: all 0.3s ease;
      }

      #message.show {
        transform: scale(1);
        opacity: 1;
        animation: bounce 0.5s ease;
      }

      @keyframes bounce {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.05);
        }
      }

      .success {
        background: rgba(16, 185, 129, 0.2);
        color: var(--success);
        border: 1px solid rgba(16, 185, 129, 0.4);
        box-shadow: 0 0 20px var(--success-glow);
      }

      .error {
        background: rgba(239, 68, 68, 0.2);
        color: var(--error);
        border: 1px solid rgba(239, 68, 68, 0.4);
        box-shadow: 0 0 20px var(--error-glow);
      }
    </style>
  </head>
  <body>
    <div class="emojis" id="emojis"></div>
    <div class="container">
      <h1>Vérificateur de réponse</h1>
      <div class="input-group">
        <input
          type="text"
          id="wordInput"
          placeholder="Entrez un mot..."
          autocomplete="off"
        />
        <button id="validateBtn">Valider</button>
      </div>
      <div id="message"></div>
    </div>
    <script>
      var sha256 = function sha256(ascii) {
        function rightRotate(value, amount) {
          return (value >>> amount) | (value << (32 - amount));
        }

        var mathPow = Math.pow;
        var maxWord = mathPow(2, 32);
        var lengthProperty = "length";
        var i, j; // Used as a counter across the whole file
        var result = "";

        var words = [];
        var asciiBitLength = ascii[lengthProperty] * 8;

        //* caching results is optional - remove/add slash from front of this line to toggle
        // Initial hash value: first 32 bits of the fractional parts of the square roots of the first 8 primes
        // (we actually calculate the first 64, but extra values are just ignored)
        var hash = (sha256.h = sha256.h || []);
        // Round constants: first 32 bits of the fractional parts of the cube roots of the first 64 primes
        var k = (sha256.k = sha256.k || []);
        var primeCounter = k[lengthProperty];
        /*/
	var hash = [], k = [];
	var primeCounter = 0;
	//*/

        var isComposite = {};
        for (var candidate = 2; primeCounter < 64; candidate++) {
          if (!isComposite[candidate]) {
            for (i = 0; i < 313; i += candidate) {
              isComposite[i] = candidate;
            }
            hash[primeCounter] = (mathPow(candidate, 0.5) * maxWord) | 0;
            k[primeCounter++] = (mathPow(candidate, 1 / 3) * maxWord) | 0;
          }
        }

        ascii += "\x80"; // Append Ƈ' bit (plus zero padding)
        while ((ascii[lengthProperty] % 64) - 56) ascii += "\x00"; // More zero padding
        for (i = 0; i < ascii[lengthProperty]; i++) {
          j = ascii.charCodeAt(i);
          if (j >> 8) return; // ASCII check: only accept characters in range 0-255
          words[i >> 2] |= j << (((3 - i) % 4) * 8);
        }
        words[words[lengthProperty]] = (asciiBitLength / maxWord) | 0;
        words[words[lengthProperty]] = asciiBitLength;

        // process each chunk
        for (j = 0; j < words[lengthProperty]; ) {
          var w = words.slice(j, (j += 16)); // The message is expanded into 64 words as part of the iteration
          var oldHash = hash;
          // This is now the undefinedworking hash", often labelled as variables a...g
          // (we have to truncate as well, otherwise extra entries at the end accumulate
          hash = hash.slice(0, 8);

          for (i = 0; i < 64; i++) {
            var i2 = i + j;
            // Expand the message into 64 words
            // Used below if
            var w15 = w[i - 15],
              w2 = w[i - 2];

            // Iterate
            var a = hash[0],
              e = hash[4];
            var temp1 =
              hash[7] +
              (rightRotate(e, 6) ^ rightRotate(e, 11) ^ rightRotate(e, 25)) + // S1
              ((e & hash[5]) ^ (~e & hash[6])) + // ch
              k[i] +
              // Expand the message schedule if needed
              (w[i] =
                i < 16
                  ? w[i]
                  : (w[i - 16] +
                      (rightRotate(w15, 7) ^
                        rightRotate(w15, 18) ^
                        (w15 >>> 3)) + // s0
                      w[i - 7] +
                      (rightRotate(w2, 17) ^
                        rightRotate(w2, 19) ^
                        (w2 >>> 10))) | // s1
                    0);
            // This is only used once, so *could* be moved below, but it only saves 4 bytes and makes things unreadble
            var temp2 =
              (rightRotate(a, 2) ^ rightRotate(a, 13) ^ rightRotate(a, 22)) + // S0
              ((a & hash[1]) ^ (a & hash[2]) ^ (hash[1] & hash[2])); // maj

            hash = [(temp1 + temp2) | 0].concat(hash); // We don't bother trimming off the extra ones, they're harmless as long as we're truncating when we do the slice()
            hash[4] = (hash[4] + temp1) | 0;
          }

          for (i = 0; i < 8; i++) {
            hash[i] = (hash[i] + oldHash[i]) | 0;
          }
        }

        for (i = 0; i < 8; i++) {
          for (j = 3; j + 1; j--) {
            var b = (hash[i] >> (j * 8)) & 255;
            result += (b < 16 ? 0 : "") + b.toString(16);
          }
        }
        return result;
      };

      const wordInput = document.getElementById("wordInput");
      const validateBtn = document.getElementById("validateBtn");
      const messageEl = document.getElementById("message");
      const emojisContainer = document.getElementById("emojis");

      // Emojis pour l'explosion
      const explosionEmojis = [
        "😊",
        "😃",
        "😍",
        "🤩",
        "😁",
        "😆",
        "🤗",
        "🤯",
        "👍",
        "✅",
        "❤️",
        "💖",
        "🌟",
        "✨",
        "🎉",
        "💯",
        "🥳",
        "😎",
        "🤘",
        "🙌",
      ];

      let emojiElements = [];
      let explosionActive = false;
      let animationFrameId = null;

      // Créer les emojis ❓ qui dérivent
      function createDriftEmojis() {
        if (animationFrameId) {
          cancelAnimationFrame(animationFrameId);
          animationFrameId = null;
        }

        emojisContainer.innerHTML = "";
        emojiElements = [];
        explosionActive = false;

        for (let i = 0; i < 15; i++) {
          const emoji = document.createElement("div");
          emoji.classList.add("emoji", "drift");
          emoji.textContent = "❓";
          emoji.style.left = `${Math.random() * 100}%`;
          emoji.style.top = `${Math.random() * 100 + 100}%`;
          emoji.style.fontSize = `${0.8 + Math.random() * 1.2}rem`;
          emoji.style.animationDelay = `${Math.random() * 15}s`;
          emoji.style.animationDuration = `${10 + Math.random() * 10}s`;
          emojisContainer.appendChild(emoji);
          emojiElements.push(emoji);
        }
      }

      // Créer une explosion de smileys
      function createExplosion() {
        if (animationFrameId) {
          cancelAnimationFrame(animationFrameId);
        }

        emojisContainer.innerHTML = "";
        emojiElements = [];
        explosionActive = true;

        const centerX = window.innerWidth / 2;
        const centerY = window.innerHeight / 2;
        const startTime = Date.now();

        for (let i = 0; i < 60; i++) {
          const emoji = document.createElement("div");
          emoji.classList.add("emoji");
          emoji.textContent =
            explosionEmojis[Math.floor(Math.random() * explosionEmojis.length)];

          // Taille aléatoire
          const size = 0.8 + Math.random() * 1.5;
          emoji.style.fontSize = `${size}rem`;

          // Position initiale au centre
          emoji.style.left = `${centerX}px`;
          emoji.style.top = `${centerY}px`;
          emoji.style.transform = "translate(-50%, -50%)";

          // Stockage des données de mouvement
          emoji.dataset.vx = (Math.random() - 0.5) * 15;
          emoji.dataset.vy = (Math.random() - 0.5) * 15 - 5; // -5 pour la gravité initiale
          emoji.dataset.rotation = Math.random() * 360;
          emoji.dataset.rotationSpeed = (Math.random() - 0.5) * 300;
          emoji.dataset.startTime = startTime;
          emoji.dataset.size = size;

          emojisContainer.appendChild(emoji);
          emojiElements.push(emoji);
        }

        animateExplosion(startTime, centerX, centerY);
      }

      // Animer l'explosion
      function animateExplosion(startTime, centerX, centerY) {
        const now = Date.now();
        const elapsed = (now - startTime) / 1000;

        if (elapsed >= 2) {
          createDriftEmojis();
          return;
        }

        emojiElements.forEach((emoji) => {
          const vx = parseFloat(emoji.dataset.vx);
          const vy = parseFloat(emoji.dataset.vy);
          const rotation = parseFloat(emoji.dataset.rotation);
          const rotationSpeed = parseFloat(emoji.dataset.rotationSpeed);
          const size = parseFloat(emoji.dataset.size);

          // Position avec gravité
          const x = centerX + vx * elapsed * 40;
          const y =
            centerY + vy * elapsed * 40 + 0.5 * 9.8 * elapsed * elapsed * 40;

          emoji.style.left = `${x}px`;
          emoji.style.top = `${y}px`;
          emoji.style.transform = `translate(-50%, -50%) rotate(${rotation + rotationSpeed * elapsed}deg) scale(${1 + elapsed * 0.2})`;
          emoji.style.opacity = Math.max(0, 1 - elapsed / 2);
        });

        animationFrameId = requestAnimationFrame(() =>
          animateExplosion(startTime, centerX, centerY),
        );
      }

      // Liste des réponses acceptées
      // encrypt here : https://geraintluff.github.io/sha256/
      const acceptedAnswers = [
        "68990b444f21d8c0da58b138a9debd2543851d416de20c8b346bcfb3de9ab5ae",
        "d56e6d7a8b1bc1b0e4dbdc54a69f8c9350877cecbb029e466073d9b58ec420d1",
      ];

      validateBtn.addEventListener("click", () => {
        const userWord = wordInput.value.trim().toLowerCase();
        const shaAnswer = sha256(userWord);

        messageEl.classList.add("show");

        if (acceptedAnswers.includes(shaAnswer)) {
          messageEl.textContent = "✅ Bravo ! C'est la bonne réponse.";
          messageEl.className = "success show";
          createExplosion();
        } else if (userWord === "") {
          messageEl.textContent = "❌ Veuillez entrer un mot.";
          messageEl.className = "error show";
        } else {
          messageEl.textContent = "❌ Mauvaise réponse !";
          messageEl.className = "error show";
        }
      });

      // Réinitialiser quand on tape
      wordInput.addEventListener("input", () => {
        messageEl.textContent = "";
        messageEl.className = "";
      });

      // Initialiser
      createDriftEmojis();
    </script>
  </body>
</html>
